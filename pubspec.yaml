name: rutin
description: Alışkanlık takip uygulaması — streak sayacı, günlük checklist, su takibi ve takvim.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0
  intl: ^0.19.0
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.0
  share_plus: ^10.0.0
  supabase_flutter: ^2.8.0
  sentry_flutter: ^9.0.0
  in_app_review: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/nav/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#E25428"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
