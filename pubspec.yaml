name: rutin
description: Alışkanlık takip uygulaması — streak sayacı, günlük checklist, su takibi ve takvim.
publish_to: 'none'
version: 1.0.0+14

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0
  intl: ^0.20.2
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.0
  share_plus: ^10.0.0
  supabase_flutter: ^2.8.0
  sentry_flutter: ^9.0.0
  in_app_review: ^2.0.9
  http: ^1.2.0
  home_widget: ^0.6.0
  # Gizlilik politikası / kullanım koşulları bağlantılarını tarayıcıda açmak
  # için. Bu bağlantılar App Store (3.1.2 abonelikler, 5.1.1 gizlilik) ve
  # Google Play tarafından ZORUNLU tutuluyor; uygulamada hiç yoktu.
  url_launcher: ^6.3.0
  # iOS'ta YEREL "Apple ile Giriş Yap" için. Tarayıcı tabanlı OAuth akışı
  # iOS'ta hem güvenilir çalışmıyor hem de App Store incelemesinde sorun
  # çıkarıyor (kullanıcı cihazındaki Apple hesabıyla giriş beklenir).
  # Android'de bu paket kullanılmaz; orada tarayıcı akışı doğru olandır.
  sign_in_with_apple: ^6.1.3
  # Yerel Apple akışında zorunlu olan nonce'un SHA-256 özetini almak için.
  crypto: ^3.0.3
  app_tracking_transparency: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/
    - assets/nav/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#02081B"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
