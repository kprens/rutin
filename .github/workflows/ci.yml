# Rutin — sürekli entegrasyon.
#
# NEDEN VAR: Bu projede testler (112 adet) kritik davranışları koruyor —
# veri kaybı zinciri, IAP ürün tipi ayrımı, analitikteki PII filtresi.
# Ama hiçbir otomasyon onları çalıştırmıyordu; yani bir regresyon ancak
# birisi elle `flutter test` yazarsa fark edilirdi. Bu iş akışı, testleri
# her push ve her PR'da zorunlu hale getirir.
#
# ÜÇ KATMAN, ÜÇ FARKLI HATA SINIFI:
#
#   1. analyze-and-test  — saf mantık + duman testleri (ubuntu, saniyeler).
#      Duman testleri (test/smoke_test.dart) widget ağacını GERÇEKTEN kurar:
#      uygulama açılıyor mu, paywall plan gösteriyor mu. Daha önce 100'den
#      fazla test vardı ama hiçbiri uygulamayı çalıştırmıyordu.
#   2. build-android / build-ios — kod derleniyor mu.
#   3. integration-android — GERÇEK emülatörde platform kanalları.
#      Bildirim ikonu hatası (Sentry RUTIN-1/RUTIN-2) tam olarak buradaydı:
#      kod doğru, derleme başarılı, testler yeşil — uygulama açılışta
#      çöküyordu. Yalnızca gerçek bir Android bunu gösterir.
#
# Public repo olduğu için GitHub Actions dakikaları ücretsizdir.

name: CI

on:
  # Dal filtresi YOK — bilinçli.
  #
  # Önceden yalnızca [main, theme-update] listelenmişti. Sonuç: bir özellik
  # ya da denetim dalına yapılan push hiç CI çalıştırmıyor, geri bildirim
  # PR açılana kadar gecikiyordu. Kırık bir değişikliği bir saat sonra
  # öğrenmek yerine iki dakika sonra öğrenmek istiyoruz. (theme-update
  # dalı zaten main'e birleştirildi, listede tutmanın anlamı da kalmamıştı.)
  #
  # Maliyet: aşağıdaki `concurrency` bloğu aynı dala arka arkaya yapılan
  # pushlarda eski koşuyu iptal ediyor, yani hızlı ardışık pushlar tek koşu
  # kadar harcıyor.
  push:
  pull_request:
  # Elle de tetiklenebilsin.
  workflow_dispatch:

# Aynı dal için üst üste push yapıldığında eski koşuyu iptal et —
# gereksiz dakika harcamasın.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Geliştirme makinesindeki sürümle AYNI olmalı; aksi halde CI'da geçen bir
  # şey yerelde patlayabilir (ya da tersi). Flutter yükseltilirken burası da
  # güncellenmeli.
  FLUTTER_VERSION: 3.44.5

jobs:
  analyze-and-test:
    name: Analiz + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      # NOT: `dart format` kontrolü bilinçli olarak YOK. Kod tabanının bir
      # kısmı `dart format` çıktısıyla birebir aynı değil; bunu zorunlu kılmak
      # ya ~39 dosyalık mekanik bir diff gerektirir ya da CI'da kalıcı bir
      # uyarı bırakır. Kalıcı uyarı, insanları CI'ı görmezden gelmeye
      # alıştırdığı için kontrolün kendisinden daha zararlıdır. Biçimlendirme
      # yapılmak istenirse: `dart format lib test` + ayrı bir commit.

      - name: Statik analiz
        # Analyzer ŞU AN TAMAMEN TEMİZ (0 hata, 0 uyarı, 0 info). Bu yüzden
        # kapı katı tutulabiliyor: yeni bir uyarı eklenirse build kırılır.
        run: flutter analyze --no-pub --fatal-warnings

      # `test/` altındaki her şey: saf mantık testleri VE duman testleri
      # (test/smoke_test.dart — uygulamayı gerçekten kurup çizen katman).
      - name: Testler
        run: flutter test --no-pub --reporter expanded

      # Duman testleri ayrıca ve AÇIKÇA koşulur.
      #
      # Yukarıdaki adım zaten hepsini çalıştırıyor; buradaki tekrar kasıtlı.
      # Duman testleri bu projede üç App Store reddinin ve iki ölümcül
      # açılış hatasının regresyon kilidi. Dosya yanlışlıkla silinir ya da
      # yeniden adlandırılırsa bu adım "test bulunamadı" diyerek build'i
      # kırar; tek bir toplu koşuda ise sessizce kaybolurdu.
      - name: Duman testleri (uygulama gerçekten açılıyor mu)
        run: flutter test --no-pub test/smoke_test.dart

      # Bilgilendirme amaçlı — build'i KIRMAZ.
      #
      # Amaç bağımlılık borcunu görünür tutmak. Şu an 21 paket daha yeni bir
      # sürüme kısıtlanmış durumda ve 7 eklenti hâlâ Kotlin Gradle Plugin
      # uyguluyor ("Future versions of Flutter will fail to build..."). Bu
      # borç sessizce büyürse bir Flutter yükseltmesinde Android derlemesi
      # tamamen kırılır. Kapıyı katı yapmıyoruz: yükseltme kararı insana ait,
      # ama karar verirken sayıyı görmek gerekiyor.
      - name: Bağımlılık raporu (bilgilendirme)
        run: flutter pub outdated || true

  build-android:
    name: Android derleme
    runs-on: ubuntu-latest
    # Test geçmeden derlemeye girip dakika harcama.
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      # ÖNEMLİ: Burada RELEASE derlemesi yapılmaz.
      #
      # Release derlemesi imza anahtarı (key.properties + .jks) ve
      # --dart-define ile verilen üretim değerleri (Supabase, AdMob, Sentry)
      # gerektirir. Bunların hiçbiri repoda YOKTUR ve olmamalıdır. Buradaki
      # amaç "mağazaya çıkacak paketi üretmek" değil, "kod gerçekten
      # derleniyor mu" sorusunu her değişiklikte yanıtlamaktır.
      - name: Debug APK derle
        run: flutter build apk --debug

  build-ios:
    name: iOS derleme
    runs-on: macos-latest
    # Test geçmeden derlemeye girip dakika harcama.
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      # NEDEN VAR: Bu uygulama iOS'ta yayınlanıyor ama CI yalnızca Android
      # derliyordu. iOS tarafını kıran bir değişiklik (Info.plist, entitlement,
      # Podfile, platform kanalı kullanan Dart kodu) CI'dan YEŞİL geçiyordu ve
      # ancak biri elle `flutter build ipa` çalıştırınca fark ediliyordu.
      #
      # --no-codesign: imzalama sertifikası ve provisioning profile repoda
      # YOKTUR ve olmamalıdır. Buradaki soru "mağazaya çıkacak paketi üret"
      # değil, "iOS tarafı gerçekten derleniyor mu".
      - name: iOS derle (imzasız)
        run: flutter build ios --debug --no-codesign

  integration-android:
    name: Entegrasyon (gerçek emülatör)
    runs-on: ubuntu-latest
    # Derleme geçmeden emülatör açıp dakika harcama.
    needs: build-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      # Donanım hızlandırma olmadan emülatör pratikte kullanılamayacak kadar
      # yavaş. GitHub'ın ubuntu koşucularında KVM var ama izinleri elle
      # açılmalı.
      - name: KVM izinlerini aç
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # NEDEN GERÇEK EMÜLATÖR: test/ altındaki testler platform kanallarına
      # hiç dokunmaz, mock'lanmış bir dünyada koşar. Sahaya kaçan hataların
      # bir kısmı tam olarak Dart ile native arasında oluştu:
      #
      #   PlatformException(invalid_icon, The resource ic_notification could
      #   not be found...)  → Sentry RUTIN-1 / RUTIN-2
      #
      # Kod doğruydu, derleme başarılıydı, 100+ test yeşildi ve uygulama
      # kullanıcıda AÇILIŞTA çöküyordu. integration_test/ bu sınıfı yakalar.
      #
      # API 34: uygulamanın targetSdk'sı 36 ama emülatör imajı ne kadar
      # yeniyse o kadar yavaş ve kararsız açılıyor. 34, bildirim ve
      # SharedPreferences yollarını doğrulamak için yeterli; Android 15+
      # davranış değişiklikleri (widget PendingIntent) derleme ve gerçek
      # cihaz testiyle ayrıca kapsanıyor.
      - name: Emülatörde entegrasyon testleri
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test/ --no-pub
